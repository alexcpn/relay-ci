name: new-ci-system

defaults:
  image: golang:1.24
  env:
    CI: "true"
    CGO_ENABLED: "0"
    GOPATH: /go
  cpu: 1000
  memory_mb: 512
  timeout: 300

triggers:
  branches: [main]
  pull_requests: true
  paths:
    - "**/*.go"
    - "**/*.proto"
    - "go.mod"
    - "go.sum"
    - "Makefile"
    - "web/**"

tasks:
  - id: clone
    image: alpine/git:latest
    commands:
      - |
        if [ -n "$RELAY_LOCAL_REPO_PATH" ]; then
          # Local file:// submit — copy the bind-mounted folder so the build
          # sees uncommitted changes too. No git checkout needed.
          cp -a /relay-local-repo/. /workspace/
        else
          git clone --depth=1 --branch $BRANCH $REPO_URL /workspace
          cd /workspace && git checkout $COMMIT_SHA
        fi

  - id: proto
    commands:
      - apt-get update -qq && apt-get install -y -qq protobuf-compiler
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - make proto
    depends_on: [clone]
    cache:
      - key: gomod
        path: /go/pkg/mod

  - id: build
    commands:
      - go build -o bin/ci-master ./cmd/master
      - go build -o bin/ci-worker ./cmd/worker
      - go build -o bin/ci-cli ./cmd/cli
      - go build -o bin/ci-mcp ./cmd/mcp
    depends_on: [proto]
    cache:
      - key: gomod
        path: /go/pkg/mod

  - id: test
    commands:
      - go test -race -count=1 ./...
    depends_on: [proto]
    env:
      CGO_ENABLED: "1"
    cache:
      - key: gomod
        path: /go/pkg/mod
    cpu: 2000
    memory_mb: 1024

  - id: lint
    image: golangci/golangci-lint:latest
    commands:
      - golangci-lint run --timeout=5m
    depends_on: [proto]
    cache:
      - key: gomod
        path: /go/pkg/mod
      - key: golangci-lint-cache
        path: /root/.cache/golangci-lint
    memory_mb: 2048

  - id: web-build
    image: node:20-alpine
    commands:
      - cd /workspace/web
      - npm ci --no-audit --no-fund
      - npm run build
    depends_on: [clone]
    cache:
      - key: npm
        path: /root/.npm
    memory_mb: 2048

  - id: web-lint
    image: node:20-alpine
    commands:
      - cd /workspace/web
      - npm ci --no-audit --no-fund
      - npm run lint
    depends_on: [clone]
    cache:
      - key: npm
        path: /root/.npm
    memory_mb: 1024

integrations:
  security:
    enabled: true
    tools:
      - name: trivy
        severity: HIGH,CRITICAL
        fail_on_findings: true

  code_review:
    enabled: true
    provider: anthropic          # or "openai" or "ollama"
    api_key_secret: ANTHROPIC_API_KEY
    model: claude-sonnet-4-6
    base_branch: main
    reviewer_prompt: code-reviewer.md
    fail_on_critical: true       # exit 1 if verdict is No or Critical issues found
